services:
  - type: web
    name: bella-app
    env: node
    plan: starter
    buildCommand: npm --prefix frontend install --include=dev && npm --prefix frontend run build && npm --prefix backend install
    startCommand: node backend/src/server.js
    disk:
      name: bella-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: CMOT_BASE_URL
        value: https://cmot-app.onrender.com
      - key: CMOT_EMAIL
        sync: false
      - key: CMOT_SENHA
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: BACKUP_EMAIL_USER
        sync: false
      - key: BACKUP_EMAIL_PASS
        sync: false
